<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel Hotspot UAI</title>
    <link rel="stylesheet" href="/admin.css">
  </head>
  <body>
    <main class="admin-shell">
      <header class="topbar">
        <div>
          <span class="eyebrow">UAI Telecom</span>
          <h1>Leads do Hotspot</h1>
        </div>
        <button id="exportCsv" type="button">Exportar CSV</button>
      </header>

      <section class="metrics" aria-label="Resumo">
        <article>
          <span>Total</span>
          <strong id="totalCount">0</strong>
        </article>
        <article>
          <span>Clientes liberados</span>
          <strong id="releasedCount">0</strong>
        </article>
        <article>
          <span>Instagram</span>
          <strong id="instagramCount">0</strong>
        </article>
      </section>

      <section class="toolbar">
        <input id="search" type="search" placeholder="Buscar por nome, CPF, telefone, email, IP ou MAC">
        <button id="refresh" type="button">Atualizar</button>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Email</th>
              <th>CPF</th>
              <th>Status</th>
              <th>IP/MAC</th>
            </tr>
          </thead>
          <tbody id="leadsBody">
            <tr>
              <td colspan="7">Carregando...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
