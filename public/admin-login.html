<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login do Painel UAI</title>
    <link rel="stylesheet" href="/admin.css">
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-label="Login do painel">
        <div class="login-logo" aria-label="UAI Telecom">
          <span class="login-logo-word">uai</span>
          <span class="login-logo-dot"></span>
          <span class="login-logo-name">uai telecom</span>
        </div>
        <h1>Painel de Leads</h1>
        <p>Acesse os registros de pessoas que usaram o hotspot.</p>

        <form id="loginForm">
          <label for="user">Usuário</label>
          <input id="user" name="user" type="text" autocomplete="username" placeholder="Digite seu usuário" required>

          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>

          <button type="submit">Entrar</button>
          <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="/admin-login.js"></script>
  </body>
</html>
